<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>贪吃蛇 · 原型版（我最早的那一版，留着当反面教材）</title>
  <!--
    ============================================================
    这是“原型版”：规则完整、能正常玩，但是留了两个坑：

    坑 1：在第 4 步里，按键立刻改方向。
          向右走时，快速按 ↑ 再按 ←，蛇会一步撞进自己的身体。
          修复方法见第 11 步：加一个 nextDirection 缓冲。

    坑 2：没有 event.preventDefault()。
          按 ↓ 或空格时，整页会跟着滚。

    “坑 2”已经在下面修掉了（否则页面会抖，体验很糟）。
    “坑 1”保留原样 —— 它是练习用的。
    ============================================================
  -->
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      background: #0f1115;
      color: #e6e8eb;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    #score { font-size: 18px; font-weight: bold; }

    #board {
      background: #161a20;
      border: 2px solid #2a2f38;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="score">得分：0</div>
  <canvas id="board" width="480" height="480"></canvas>

  <script>
    const board = document.getElementById("board");
    const pen = board.getContext("2d");

    const CELL = 20;
    const BOARD_SIZE = 24;

    const snake = [
      { col: 10, row: 8 },
      { col: 9,  row: 8 },
      { col: 8,  row: 8 },
    ];

    const DIRECTIONS = {
      ArrowUp:    { col:  0, row: -1 },
      ArrowDown:  { col:  0, row:  1 },
      ArrowLeft:  { col: -1, row:  0 },
      ArrowRight: { col:  1, row:  0 },
    };

    let direction = { ...DIRECTIONS.ArrowRight };
    let status = "playing";
    let score = 0;
    let food = { col: 5, row: 5 };

    function placeFood() {
      food = {
        col: Math.floor(Math.random() * BOARD_SIZE),
        row: Math.floor(Math.random() * BOARD_SIZE),
      };
    }

    placeFood();

    document.addEventListener("keydown", function (event) {
      const wanted = DIRECTIONS[event.key];

      // 坑 2 的修复：方向键和空格会滚动页面，直接拦掉
      if (wanted || event.key === " ") event.preventDefault();

      if (!wanted) return;

      // 这里只防了“直接掉头”，没有防“快速连按”
      const isOpposite =
        wanted.col === -direction.col && wanted.row === -direction.row;
      if (isOpposite) return;

      direction = { ...wanted };   // 坑 1：立刻改方向
    });

    function draw() {
      pen.clearRect(0, 0, board.width, board.height);

      snake.forEach(function (part, index) {
        pen.fillStyle = index === 0 ? "#4ade80" : "#22c55e";
        pen.fillRect(part.col * CELL, part.row * CELL, CELL, CELL);
      });

      pen.fillStyle = "#ff6b6b";
      pen.fillRect(food.col * CELL, food.row * CELL, CELL, CELL);
    }

    let speed = 150;
    let lastMove = 0;

    function update() {
      const head = snake[0];
      const next = {
        col: head.col + direction.col,
        row: head.row + direction.row,
      };

      if (
        next.col < 0 || next.col >= BOARD_SIZE ||
        next.row < 0 || next.row >= BOARD_SIZE
      ) {
        status = "over";
        draw();
        pen.fillStyle = "rgba(0, 0, 0, .6)";
        pen.fillRect(0, 0, board.width, board.height);
        pen.fillStyle = "#fff";
        pen.font = "24px 'Microsoft YaHei', sans-serif";
        pen.textAlign = "center";
        pen.fillText("游戏结束 · 得分 " + score + "（刷新页面重开）", board.width / 2, board.height / 2);
        return;
      }

      const hitSelf = snake.some(function (part) {
        return part.col === next.col && part.row === next.row;
      });
      if (hitSelf) {
        status = "over";
        return;
      }

      snake.unshift(next);

      if (next.col === food.col && next.row === food.row) {
        score += 10;
        document.getElementById("score").textContent = "得分：" + score;
        placeFood();
      } else {
        snake.pop();
      }
    }

    function loop(now) {
      if (status === "playing" && now - lastMove >= speed) {
        update();
        lastMove = now;
        draw();
      }
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
    draw();
  </script>

</body>
</html>
